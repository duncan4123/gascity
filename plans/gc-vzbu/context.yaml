acceptance_criteria:
  - "A dedicated build workspace exists or the implementation documents why an existing workspace should be reused."
  - "The build workspace jj @ is on the intended DoltLite integration line, not the upstream PR/docs line."
  - "The beads-doltlite build command is documented with explicit --gc-source and --bd-source behavior where relevant."
  - "A preflight or runbook prevents accidental install from the default gascity checkout when it is on a PR/docs line."
  - "Validation includes jj status/log evidence for the source workspace and a no-install dry build or bounded build check if appropriate."
